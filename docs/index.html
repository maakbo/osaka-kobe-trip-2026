<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,noimageindex" />
    <meta
      name="description"
      content="2026年夏、大阪・USJ・神戸をめぐる家族旅行のしおり。"
    />
    <title>大阪・神戸 家族旅行 2026</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="hero">
        <div class="hero__inner">
          <div class="eyebrow"><span aria-hidden="true"></span>FAMILY TRIP GUIDE</div>
          <div class="hero__head">
            <div>
              <p class="date">7.29 - 8.2</p>
              <h1>大阪・神戸 家族旅行</h1>
              <p class="lead">
                家族3人で、夏の大阪・USJ・神戸へ。<br />
                全部回るより、笑って終われる旅に。
              </p>
            </div>
            <div class="hero__side">
              <p>2026</p>
              <p>山形 → 仙台 → 大阪 → 神戸 → 山形</p>
            </div>
          </div>
          <div class="actions" aria-label="しおりの操作">
            <a class="button button--primary" href="#guide">しおりを見る</a>
            <a
              class="button"
              href="osaka-kobe-family-trip-guide-2026.pdf"
              target="_blank"
              rel="noreferrer"
              >PDFを開く</a
            >
          </div>
        </div>
      </header>

      <section class="guide" id="guide" aria-labelledby="guide-title">
        <div class="section-heading">
          <p>TRIP PAGES</p>
          <h2 id="guide-title">旅のしおり 全8ページ</h2>
          <span>上から順番に、旅の流れを確認できます。</span>
        </div>

        <div class="pages">
          <figure class="page">
            <figcaption><span>PAGE 01</span>全日程</figcaption>
            <img
              src="guide/overview.png"
              alt="大阪・神戸家族旅行の全日程まとめ"
              width="1080"
              height="1920"
            />
          </figure>
          <figure class="page">
            <figcaption><span>PAGE 02</span>7月29日 仙台前泊</figcaption>
            <img
              src="guide/day-0.png"
              alt="7月29日、仙台前泊日のしおり"
              width="1080"
              height="1920"
              loading="lazy"
            />
          </figure>
          <figure class="page">
            <figcaption><span>PAGE 03</span>7月30日 大阪観光</figcaption>
            <img
              src="guide/day-1.png"
              alt="7月30日、大阪観光日のしおり"
              width="1080"
              height="1920"
              loading="lazy"
            />
          </figure>
          <figure class="page">
            <figcaption><span>PAGE 04</span>7月31日 USJ</figcaption>
            <img
              src="guide/day-2.png"
              alt="7月31日、USJ日のしおり"
              width="1080"
              height="1920"
              loading="lazy"
            />
          </figure>
          <figure class="page">
            <figcaption><span>PAGE 05</span>8月1日 有馬温泉・神戸</figcaption>
            <img
              src="guide/day-3.png"
              alt="8月1日、有馬温泉と神戸観光日のしおり"
              width="1080"
              height="1920"
              loading="lazy"
            />
          </figure>
          <figure class="page">
            <figcaption><span>PAGE 06</span>8月2日 神戸観光・帰宅</figcaption>
            <img
              src="guide/day-4.png"
              alt="8月2日、神戸観光と帰宅日のしおり"
              width="1080"
              height="1920"
              loading="lazy"
            />
          </figure>
          <figure class="page">
            <figcaption><span>PAGE 07</span>持ち物チェック</figcaption>
            <img
              src="guide/packing-checklist.png"
              alt="家族旅行の持ち物チェックリスト"
              width="1080"
              height="1920"
              loading="lazy"
            />
          </figure>
          <figure class="page">
            <figcaption><span>PAGE 08</span>出発前チェック</figcaption>
            <img
              src="guide/before-you-go.png"
              alt="出発前とUSJ前の確認チェックリスト"
              width="1080"
              height="1920"
              loading="lazy"
            />
          </figure>
        </div>
      </section>

      <footer>
        <p>大阪・神戸 家族旅行 2026</p>
        <a
          href="osaka-kobe-family-trip-guide-2026.pdf"
          target="_blank"
          rel="noreferrer"
          >PDF版を開く</a
        >
      </footer>

      <nav class="mobile-actions" aria-label="固定メニュー">
        <a href="#guide">しおり</a>
        <a
          href="osaka-kobe-family-trip-guide-2026.pdf"
          target="_blank"
          rel="noreferrer"
          >PDF</a
        >
      </nav>
    </main>
  </body>
</html>
